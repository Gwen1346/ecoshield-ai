<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - EcoShield AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-10">

  <nav class="border-b border-slate-800 bg-slate-900/80 p-4">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <a href="/" class="text-lg font-bold text-emerald-400 flex items-center gap-2">
        ← Kembali ke Home
      </a>
      <span class="text-sm font-semibold text-slate-400">EcoShield Engine v1.0</span>
    </div>
  </nav>

  <main class="max-w-xl mx-auto p-6 mt-6 space-y-6">
    <!-- Form Analisis -->
    <div class="bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700">
      <div class="mb-6">
        <h1 class="text-xl font-bold text-emerald-400">🛡️ Dashboard Analisis</h1>
        <p class="text-xs text-slate-400">Masukkan rencana pembelianmu untuk diperiksa oleh AI.</p>
      </div>

      <form id="purchaseForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-300">Nama Barang</label>
          <input type="text" id="namaBarang" placeholder="ex: Kemeja Fast Fashion" required
            class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-400">
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-300">Harga Barang</label>
          <input type="text" id="hargaBarang" placeholder="Rp 0" required
            class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-400">
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-300">Total Tabungan</label>
          <input type="text" id="tabungan" placeholder="Rp 0" required
            class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-400">
        </div>

        <button type="submit" id="btnCheck"
          class="w-full bg-emerald-500 hover:bg-emerald-600 font-semibold text-slate-950 py-2.5 rounded-lg text-sm transition">
          Cek Keputusan AI
        </button>
      </form>

      <!-- Hasil Respon AI -->
      <div id="aiResponse" class="mt-6 p-4 bg-slate-700/50 rounded-lg border border-slate-600 hidden space-y-4">
        <div class="flex items-center justify-between border-b border-slate-600 pb-3">
          <span class="text-xs font-bold text-slate-300">Status Risiko:</span>
          <span id="badgeStatus" class="px-3 py-1 text-xs font-bold rounded-full"></span>
        </div>

        <div>
          <h3 class="text-xs font-bold text-emerald-400 mb-1">🤖 Analisis AI:</h3>
          <p id="responseText" class="text-sm text-slate-200 leading-relaxed"></p>
        </div>

        <div class="bg-emerald-950/40 border border-emerald-500/30 p-3 rounded-lg">
          <h4 class="text-xs font-bold text-emerald-400 flex items-center gap-1">🌱 Alternatif Investasi Hijau (1 Tahun):</h4>
          <p id="greenReturnText" class="text-xs text-slate-300 mt-1"></p>
        </div>
      </div>
    </div>

    <!-- Section Riwayat Analisis -->
    <div class="bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-sm font-bold text-slate-200 flex items-center gap-2">
          📜 Riwayat Analisis Terakhir (Max 5)
        </h2>
        <button id="btnClearHistory" class="text-xs text-rose-400 hover:underline hidden">
          Hapus Riwayat
        </button>
      </div>
      <div id="historyList" class="space-y-3">
        <p id="emptyHistory" class="text-xs text-slate-500 italic text-center py-2">Belum ada riwayat analisis.</p>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('purchaseForm');
    const inputHarga = document.getElementById('hargaBarang');
    const inputTabungan = document.getElementById('tabungan');
    const aiResponse = document.getElementById('aiResponse');
    const badgeStatus = document.getElementById('badgeStatus');
    const responseText = document.getElementById('responseText');
    const greenReturnText = document.getElementById('greenReturnText');
    const btnCheck = document.getElementById('btnCheck');
    const historyList = document.getElementById('historyList');
    const emptyHistory = document.getElementById('emptyHistory');
    const btnClearHistory = document.getElementById('btnClearHistory');

    // Load History saat pertama kali halaman terbuka
    document.addEventListener('DOMContentLoaded', displayHistory);

    function formatRupiah(angka) {
      const numberString = angka.replace(/[^,\d]/g, '').toString();
      const split = numberString.split(',');
      const sisa = split[0].length % 3;
      let rupiah = split[0].substr(0, sisa);
      const ribuan = split[0].substr(sisa).match(/\d{3}/gi);

      if (ribuan) {
        const separator = sisa ? '.' : '';
        rupiah += separator + ribuan.join('.');
      }

      rupiah = split[1] !== undefined ? rupiah + ',' + split[1] : rupiah;
      return rupiah ? 'Rp ' + rupiah : '';
    }

    function cleanNumber(value) {
      return Number(value.replace(/[^0-9]/g, ''));
    }

    inputHarga.addEventListener('keyup', function() { this.value = formatRupiah(this.value); });
    inputTabungan.addEventListener('keyup', function() { this.value = formatRupiah(this.value); });

    // Kelola Local Storage
    function getHistory() {
      return JSON.parse(localStorage.getItem('ecoshield_history') || '[]');
    }

    function saveToHistory(item) {
      let history = getHistory();
      history.unshift(item); // Simpan di urutan paling atas
      if (history.length > 5) history = history.slice(0, 5); // Batasi max 5
      localStorage.setItem('ecoshield_history', JSON.stringify(history));
      displayHistory();
    }

    function displayHistory() {
      const history = getHistory();
      if (history.length === 0) {
        emptyHistory.classList.remove('hidden');
        btnClearHistory.classList.add('hidden');
        historyList.innerHTML = '<p id="emptyHistory" class="text-xs text-slate-500 italic text-center py-2">Belum ada riwayat analisis.</p>';
        return;
      }

      emptyHistory.classList.add('hidden');
      btnClearHistory.classList.remove('hidden');
      historyList.innerHTML = '';

      history.forEach((data) => {
        let badgeColor = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
        if (data.status === 'BAHAYA') badgeColor = 'bg-rose-500/20 text-rose-400 border-rose-500/30';
        if (data.status === 'WASPADA') badgeColor = 'bg-amber-500/20 text-amber-400 border-amber-500/30';

        const card = document.createElement('div');
        card.className = 'p-3 bg-slate-700/40 rounded-lg border border-slate-700 flex justify-between items-center text-xs';
        card.innerHTML = `
          <div>
            <span class="font-bold text-white block">${data.namaBarang}</span>
            <span class="text-slate-400">${data.hargaFormatted}</span>
          </div>
          <span class="px-2 py-0.5 font-bold rounded-full border ${badgeColor}">${data.status}</span>
        `;
        historyList.appendChild(card);
      });
    }

    btnClearHistory.addEventListener('click', () => {
      localStorage.removeItem('ecoshield_history');
      displayHistory();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      btnCheck.innerText = 'Analisis AI sedang berjalan...';
      btnCheck.disabled = true;
      aiResponse.classList.add('hidden');

      const data = {
        namaBarang: document.getElementById('namaBarang').value,
        hargaBarang: cleanNumber(inputHarga.value),
        tabungan: cleanNumber(inputTabungan.value)
      };

      try {
        const res = await fetch('/api/analyze-purchase', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await res.json();
        if (result.success) {
          if (result.status === 'BAHAYA') {
            badgeStatus.className = 'px-3 py-1 text-xs font-bold rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30';
            badgeStatus.innerText = '🚨 BAHAYA';
          } else if (result.status === 'WASPADA') {
            badgeStatus.className = 'px-3 py-1 text-xs font-bold rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30';
            badgeStatus.innerText = '⚠️ WASPADA';
          } else {
            badgeStatus.className = 'px-3 py-1 text-xs font-bold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
            badgeStatus.innerText = '✅ AMAN';
          }

          responseText.innerText = result.analysis;
          greenReturnText.innerText = result.greenReturn1Year;
          aiResponse.classList.remove('hidden');

          // Simpan ke Riwayat LocalStorage
          saveToHistory({
            namaBarang: data.namaBarang,
            hargaFormatted: inputHarga.value,
            status: result.status
          });

        } else {
          alert('Terjadi kesalahan pada AI.');
        }
      } catch (err) {
        alert('Gagal terhubung ke server.');
      } finally {
        btnCheck.innerText = 'Cek Keputusan AI';
        btnCheck.disabled = false;
      }
    });
  </script>
</body>
</html>
